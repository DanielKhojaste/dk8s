# Runs on every push to main/dev and on every pull request.
# A PR shows these checks at the bottom; a red check means "don't merge yet".
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# If a newer commit is pushed to the same branch or PR, cancel the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  control-api:
    name: control-api · build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # Integration tests start a throwaway PostgreSQL with Testcontainers (Docker is available on GitHub's runners).
      - name: Build and test
        run: ./mvnw -B verify

  worker:
    name: worker · build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build and test
        run: ./mvnw -B verify

  frontend:
    name: frontend · lint, type-check, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker images
    needs: [control-api, worker, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Builds the control-api, worker and frontend images exactly as `docker compose up --build` would.
      - name: Build all images
        run: docker compose build
