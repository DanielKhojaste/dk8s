# Serves the built React app and forwards API calls to control-api.
# This is the production equivalent of the Vite dev-server proxy: the browser only
# ever talks to one origin, so control-api needs no CORS configuration.
server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        # "control-api" is the service name in compose.yaml; Docker's network resolves it.
        proxy_pass http://control-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Built JS/CSS files have content hashes in their names, so they can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Client-side routes (/services/1, ...) all load index.html; React Router takes it from there.
    location / {
        try_files $uri /index.html;
    }
}
