spring:
  application:
    name: control-api
  datasource:
    # Read from environment variables (see .env.example in the repo root).
    # Defaults after ":" match the defaults in compose.yaml.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dk8s}
    username: ${DB_USERNAME:dk8s}
    password: ${DB_PASSWORD:dk8s}
  jpa:
    # Flyway owns the schema; Hibernate only checks that entities match it.
    hibernate:
      ddl-auto: validate
    open-in-view: false

# Solace PubSub+ connection (see .env.example). Defaults match compose.yaml.
solace:
  jms:
    host: ${SOLACE_HOST:tcp://localhost:55554}
    msg-vpn: ${SOLACE_VPN:default}
    client-username: ${SOLACE_USERNAME:default}
    client-password: ${SOLACE_PASSWORD:default}

dk8s:
  solace:
    # Broker management API (SEMP), used to read queue statistics. Defaults match compose.yaml.
    semp-url: ${SOLACE_SEMP_URL:http://localhost:8081}
    admin-username: ${SOLACE_ADMIN_USERNAME:admin}
    admin-password: ${SOLACE_ADMIN_PASSWORD:admin}
  messaging:
    # Queue (created by infra/solace/provision.sh) holding the worker's started/completed/failed messages.
    deployment-updates-queue: dk8s.control-api.deployment-updates
